<svg xmlns="http://www.w3.org/2000/svg" width="2902" height="2586" viewBox="0 0 2902 2586" role="img" aria-labelledby="title" xml:lang="en">
  <title id="title">Task Start Conditions</title>
  <defs>
    <path id="tip" d="M3 3 22 14 3 25" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <marker id="arrowhead" viewBox="0 0 26 28" markerWidth="26" markerHeight="28" refX="22" refY="14" orient="auto" markerUnits="userSpaceOnUse">
      <use href="#tip" stroke="#444"/>
    </marker>
    <marker id="accent-arrowhead" viewBox="0 0 26 28" markerWidth="26" markerHeight="28" refX="22" refY="14" orient="auto" markerUnits="userSpaceOnUse">
      <use href="#tip" stroke="#a33"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", Times, serif; fill: #111; }
      .heading { font-size: 52px; }
      .node text { fill: currentColor; text-anchor: middle; }
      .blue { color: #246; }
      .blue circle { fill: #def; }
      .complete { color: #173; }
      .complete circle { fill: #e6f7e6; }
      .failed { color: #a33; }
      .failed circle, .graph { fill: #ffe6e6; }
      .gray { color: #444; }
      .gray circle { fill: #eee; }
      .letter { font-size: 50px; }
      .status { font-size: 27px; }
      .compact { font-size: 24px; }
      .line, .highlight { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line { stroke: #444; stroke-width: 3; }
      .dashed { stroke-dasharray: 10 12; }
      .arrow { marker-end: url(#arrowhead); }
      .highlight { stroke: #e99; stroke-width: 11; }
      .accent-arrow { stroke: #a33; marker-end: url(#accent-arrowhead); }
      .condition path { fill: #fff0bf; }
      .condition text { fill: #653e00; text-anchor: middle; font-size: 38px; }
      .condition .medium { font-size: 33px; }
      .condition .small { font-size: 30px; }
      .condition .compact { font-size: 26px; }
      .weight { font-size: 28px; }
      .graph-label { font-size: 42px; text-anchor: middle; }
      .action { font-size: 33px; }
    </style>
  </defs>

  <rect width="2902" height="2586" fill="#fff"/>

  <g aria-label="All Succeed">
    <text class="heading" x="78" y="119">All Succeed</text>

    <path class="line" d="M198 375v34q0 24 24 24h244q24 0 24 24"/>
    <path class="line" d="M490 375V457"/>
    <path class="line" d="M782 375v34q0 24-24 24h-244q-24 0-24 24"/>
    <path class="line arrow" d="M490 457V476"/>
    <path class="line arrow" d="M490 598V667"/>

    <g class="node complete" transform="translate(198 298)">
      <circle r="77"/>
      <text class="letter" y="-5">A</text>
      <text class="status" y="38">Completed</text>
    </g>
    <g class="node complete" transform="translate(490 298)">
      <circle r="77"/>
      <text class="letter" y="-5">B</text>
      <text class="status" y="38">Completed</text>
