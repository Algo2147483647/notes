<svg xmlns="http://www.w3.org/2000/svg" width="617" height="779" viewBox="0 0 617 779" role="img" aria-labelledby="title" xml:lang="en">
  <title id="title">Task Flow</title>
  <defs>
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#66737b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", Times, serif; text-anchor: middle; }
      .heading { fill: #234; font-size: 25px; }
      .node text { font-size: 22px; }
      .trigger rect { fill: #def; }
      .trigger text { fill: #246; }
      .condition rect { fill: #fff0bf; }
      .condition text { fill: #653e00; }
      .action rect { fill: #ffe6e6; }
      .action text { fill: #933; }
      .attribute rect { fill: #eee; }
      .attribute text, .annotation { fill: #456; font-size: 16px; }
      .attribute .compact { font-size: 14px; }
      .annotation { text-anchor: start; }
      .link { fill: none; stroke: #66737b; stroke-width: 1.3; stroke-linecap: round; }
      .arrow { marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="617" height="779" fill="#fff"/>
  <rect x="17" y="23" width="577" height="736" rx="22" fill="#fff" filter="url(#panel-shadow)"/>

  <text class="heading" x="305" y="69">Task</text>
  <g class="attribute" aria-label="Task attributes">
    <rect x="502" y="43" width="67" height="36" rx="11"/>
    <text x="535.5" y="67">Goal</text>
    <rect x="502" y="86" width="67" height="36" rx="11"/>
    <text class="compact" x="535.5" y="109">Constraint</text>
    <rect x="502" y="129" width="67" height="36" rx="11"/>
    <text x="535.5" y="153">Subject</text>
    <rect x="502" y="172" width="67" height="36" rx="11"/>
    <text x="535.5" y="196">State</text>
  </g>

  <g class="link">
    <path class="arrow" d="M304.5 167v52"/>
    <path d="M304.5 277v12"/>
    <path class="arrow" d="M304.5 289q0 13-13 13H151q-12.5 0-12.5 13v13"/>
    <path class="arrow" d="M304.5 289q0 13 13 13h57.5q13 0 13 13v13"/>

    <path class="arrow" d="M138.5 385 138 436"/>
    <path class="arrow" d="M138 494l-1.5 53"/>

    <path d="M388 386v13"/>
    <path class="arrow" d="M388 399q0 13-13 13h-58.5q-13 0-13 13v12"/>
    <path class="arrow" d="M388 399q0 13 13 13h58.5q13 0 13 13v14"/>
    <path class="arrow dashed" d="M472.5 497v53"/>

    <path d="M136.5 605v14q0 13 13 13h141q13 0 13 13"/>
    <path class="arrow" d="M303.5 495v165"/>
    <path d="M472.5 608v13q0 13-13 13h-143q-13 0-13 13"/>
  </g>

  <g class="node trigger">
    <rect x="248" y="110" width="115" height="57" rx="15"/>
    <text x="305.5" y="146">Trigger</text>
  </g>
  <g class="node condition">
    <rect x="247" y="219" width="115" height="58" rx="15"/>
    <text x="304.5" y="255">Condition</text>
  </g>
  <g class="node action">
