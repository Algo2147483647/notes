    <text x="388" y="365">Action</text>
  </g>
  <g class="node condition">
    <rect x="80" y="436" width="115" height="58" rx="15"/>
    <text x="137.5" y="473">Condition</text>
  </g>
  <g class="node action">
    <rect x="246" y="437" width="115" height="58" rx="15"/>
    <text x="303.5" y="474">Action</text>
  </g>
  <g class="node action">
    <rect x="414" y="439" width="117" height="58" rx="15"/>
    <text x="472.5" y="476">Action</text>
  </g>
  <text class="annotation" x="495" y="531">Async Result</text>
  <g class="node action">
