<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290" role="img" aria-labelledby="desc">
  <desc id="desc">An Agent and an Environment exchange signals over time. Each complete time step pairs upward state and reward feedback on the left with a downward action on the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: Georgia, 'Times New Roman', serif; fill: #000000; }
      .label { font-size: 25px; text-anchor: middle; }
      .math { font-size: 25px; font-style: italic; }
      .feedback { text-anchor: end; }
      .flow { fill: none; stroke: #000000; stroke-width: 2.2; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    </style>
  </defs>

  <rect width="780" height="290" fill="#ffffff"/>
  <rect class="box" x="30" y="25" width="720" height="56" rx="12"/>
  <text class="label" x="390" y="61">Agent</text>
  <rect class="box" x="30" y="209" width="720" height="56" rx="12"/>
  <text class="label" x="390" y="245">Environment</text>

  <g id="step-t-minus-1">
    <path class="flow" d="M130 209V81"/>
    <g class="feedback">
      <text class="math" x="117" y="139">S<tspan baseline-shift="sub" font-size="16">t−1</tspan></text>
      <text class="math" x="117" y="169">R<tspan baseline-shift="sub" font-size="16">t−1</tspan></text>
    </g>
    <path class="flow" d="M166 81V209"/>
    <text class="math" x="179" y="154">A<tspan baseline-shift="sub" font-size="16">t−1</tspan></text>
  </g>

  <g id="step-t">
    <path class="flow" d="M315 209V81"/>
    <g class="feedback">
      <text class="math" x="302" y="139">S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
      <text class="math" x="302" y="169">R<tspan baseline-shift="sub" font-size="16">t</tspan></text>
    </g>
    <path class="flow" d="M351 81V209"/>
    <text class="math" x="364" y="154">A<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  </g>

  <g id="step-t-plus-1">
    <path class="flow" d="M500 209V81"/>
    <g class="feedback">
      <text class="math" x="487" y="139">S<tspan baseline-shift="sub" font-size="16">t+1</tspan></text>
      <text class="math" x="487" y="169">R<tspan baseline-shift="sub" font-size="16">t+1</tspan></text>
    </g>
    <path class="flow" d="M536 81V209"/>
    <text class="math" x="549" y="154">A<tspan baseline-shift="sub" font-size="16">t+1</tspan></text>
  </g>

  <g id="step-t-plus-2">
    <path class="flow" d="M685 209V81"/>
    <g class="feedback">
      <text class="math" x="672" y="139">S<tspan baseline-shift="sub" font-size="16">t+2</tspan></text>
      <text class="math" x="672" y="169">R<tspan baseline-shift="sub" font-size="16">t+2</tspan></text>
    </g>
  </g>
  <text class="label" x="729" y="154">…</text>
</svg>
